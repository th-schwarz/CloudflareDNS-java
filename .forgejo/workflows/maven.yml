name: Maven Build and package

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK 17 and Maven
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk maven
      - name: Compile (skip tests)
        run: mvn -B compile -DskipTests
