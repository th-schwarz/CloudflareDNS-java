default:
  image: maven:3-amazoncorretto-17-alpine

stages:
  - build
  - on_commit
  - sonarcloud_scan
  - deploy_pages

variables:
  GITLAB_CLONE_DIR: "/builds/th-schwarz/CloudflareDNS-java"
  GITLAB_USERNAME: $GITLAB_USERNAME
  GITLAB_USEREMAIL: GITLAB_USEREMAIL
  SONAR_HOST_URL: $SONAR_HOST_URL
  SONAR_PROJECT_KEY: "thischwa_CloudflareDNS-java"
  SONAR_ORGANIZATION: "thischwa"
  SONAR_TOKEN: $SONAR_TOKEN
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  API_EMAIL: $API_EMAIL
  API_KEY: $API_KEY
  API_TOKEN: $API_TOKEN

build:
  stage: build
  script:
    - echo "Running package..."
    - cd ${GITLAB_CLONE_DIR}
    - mvn clean package
    - echo "Deploying GitLab Pages from docs/ (javadoc)"
    - mkdir public
    - cp -rv docs/* public/
    - cp -rv target/apidocs/* public/apidocs/
  artifacts:
    paths:
      - target/
      - public/
  except:
    - tags

on_commits:
  stage: on_commit
  dependencies:
    - build
  script:
    - echo "on_commit DONE"
  only:
    - /^feature.*$/
    - merge_request
    - develop

sonarcloud_scan:
  stage: sonarcloud_scan
  dependencies:
    - build
  script:
    - mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
  only:
    - merge_requests
    - develop