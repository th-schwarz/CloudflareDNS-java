name: "Setup Maven with GitHub Packages"

description: "Sets up JDK and caches Maven dependencies."

inputs:
  java-version:
    description: "Java version to use"
    default: "17"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up JDK
      with:
        java-version: ${{ inputs.java-version }}
      uses: actions/setup-java@v5
